name: Publish API Schema

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize runs: two concurrent runs could read the same "latest published
# version", compute the same next patch, and race on `npm publish`.
concurrency:
  group: publish-api-schema

# Pull-request runs must not hold id-token/attestations: an unreviewed branch
# would otherwise be able to publish to npm through Trusted Publishing.
# Only the `publish` job below gets them, and only for runs on `main`.
permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'

      - name: Run install
        run: pnpm i --frozen-lockfile

      - name: Generate API schema
        run: pnpm run build:api

      - name: Check for schema changes
        id: diff
        run: node scripts/checkApiSchemaChanged.ts

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@pulsate-dev'

      # setup-node's `registry-url` always writes an `_authToken` line to
      # .npmrc, even when no NODE_AUTH_TOKEN is set. An empty token line
      # makes npm think auth is already configured and it skips the OIDC
      # Trusted Publishing exchange entirely (actions/setup-node#1551).
      - name: Remove empty npm auth token placeholder
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      - name: Run install
        run: pnpm i --frozen-lockfile

      - name: Generate API schema
        run: pnpm run build:api

      - name: Check for schema changes
        id: diff
        run: node scripts/checkApiSchemaChanged.ts

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        id: version
        env:
          LATEST_VERSION: ${{ steps.diff.outputs.latest_version }}
        run: node scripts/bumpApiSchemaVersion.ts

      # Auth is via npm Trusted Publishing (OIDC): no NPM_TOKEN/NODE_AUTH_TOKEN
      # secret is used, so there is no long-lived publish credential to leak.
      # Requires the package's "Trusted Publisher" to be configured on
      # npmjs.com to this repo + this workflow file beforehand.
      - name: Publish
        if: steps.diff.outputs.changed == 'true'
        id: publish
        working-directory: resources/api-schema
        run: npm publish --provenance

      - name: Attest build provenance
        if: steps.diff.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: resources/api-schema/schema.json
